name: Atualizar linguagens

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  langs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - name: Gerar SVGs
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          OWNER: JonasaAugusto
        run: python .github/scripts/langs.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/langs-light.svg assets/langs-dark.svg
          git diff --staged --quiet || git commit -m "Atualiza gráfico de linguagens"
          git push
